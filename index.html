<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>y = -1/x</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Inter:wght@100;200&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      background: #050814;
      overflow: hidden;
      touch-action: none;
      width: 100%;
      height: 100%;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    #ui {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      z-index: 5;
    }
    #values {
      position: absolute;
      bottom: 3.5vh;
      right: 5vw;
      text-align: right;
      color: rgba(255, 255, 255, 0.85);
      font-family: 'Inter', sans-serif;
      font-size: clamp(11px, 2.6vw, 15px);
      font-weight: 200;
      line-height: 1.5;
      letter-spacing: 0.03em;
      text-shadow: 0 0 12px rgba(255,255,255,0.2);
      opacity: 0;
      transition: opacity 2.5s ease;
      z-index: 6;
    }
    #values.visible { opacity: 1; }
    #lyrics {
      position: absolute;
      top: 10vh;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      font-family: 'Dancing Script', cursive;
      font-size: clamp(24px, 7vw, 40px);
      font-weight: 700;
      color: rgba(255, 255, 255, 0.95);
      text-shadow: 0 0 30px rgba(255,255,255,0.4), 0 0 60px rgba(255,255,255,0.15);
      line-height: 1.5;
      white-space: nowrap;
      opacity: 0;
      transition: opacity 0.9s ease;
      pointer-events: none;
      z-index: 6;
      padding: 12px 32px;
      background: transparent;
    }
    #lyrics.visible { opacity: 1; }
    #start {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #050814;
      color: rgba(255,255,255,0.5);
      font-family: 'Inter', sans-serif;
      font-size: clamp(11px, 3vw, 14px);
      font-weight: 200;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      cursor: pointer;
      transition: opacity 1.5s ease;
      pointer-events: auto;
      z-index: 10;
    }
    #start.hidden {
      opacity: 0;
      pointer-events: none;
    }
    #start .hint {
      margin-top: 14px;
      font-size: clamp(9px, 2.5vw, 11px);
      letter-spacing: 0.2em;
      color: rgba(255,255,255,0.22);
      text-transform: none;
    }
    #equation-screen {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #050814;
      opacity: 0;
      pointer-events: none;
      transition: opacity 1.2s ease;
      z-index: 9;
    }
    #equation-screen.visible {
      opacity: 1;
    }
    #equation-screen .eq {
      font-family: 'Dancing Script', cursive;
      font-size: clamp(48px, 14vw, 96px);
      font-weight: 700;
      color: rgba(255, 255, 255, 0.92);
      text-shadow: 0 0 40px rgba(184, 244, 255, 0.35), 0 0 80px rgba(115, 216, 255, 0.15);
      letter-spacing: 0.05em;
    }
    #equation-screen .sub {
      margin-top: 18px;
      font-family: 'Inter', sans-serif;
      font-size: clamp(10px, 2.5vw, 13px);
      font-weight: 200;
      letter-spacing: 0.3em;
      color: rgba(255,255,255,0.25);
      text-transform: uppercase;
      text-align: center;
    }
  </style>
</head>
<body>
  <div id="start">
    <div>Touch to begin</div>
    <div class="hint">Headphones recommended</div>
  </div>
  <div id="equation-screen">
    <div>
      <div class="eq">y = -1/x</div>
      <div class="sub">A journey towards infinity</div>
    </div>
  </div>
  <canvas id="canvas"></canvas>
  <div id="ui">
    <div id="values">
      <div id="x-display">x = 10.00</div>
      <div id="y-display">y = -0.10</div>
      <div id="trend-display" style="font-size:0.7em; font-weight:400; color:rgba(184,244,255,0.7); margin-top:3px;">
        <div style="white-space:nowrap;">x &rarr; 0</div>
        <div style="white-space:nowrap;">y &rarr; -&infin;</div>
      </div>
    </div>
    <div id="lyrics"></div>
  </div>
  <audio id="music" src="music.mp3" preload="auto"></audio>

  <script>
    // ============================================================
    //  CONFIGURATION
    // ============================================================
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    const startEl = document.getElementById('start');
    const eqScreen = document.getElementById('equation-screen');
    const valuesEl = document.getElementById('values');
    const xDisplay = document.getElementById('x-display');
    const yDisplay = document.getElementById('y-display');
    const trendDisplay = document.getElementById('trend-display');
    const lyricsEl = document.getElementById('lyrics');
    const audio = document.getElementById('music');

    // ============================================================
    //  RESIZE & DPR
    // ============================================================
    let W, H, aspect;
    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      W = Math.floor(window.innerWidth * dpr);
      H = Math.floor(window.innerHeight * dpr);
      canvas.width = W;
      canvas.height = H;
      canvas.style.width = window.innerWidth + 'px';
      canvas.style.height = window.innerHeight + 'px';
      aspect = W / H;
    }
    window.addEventListener('resize', resize);
    resize();

    // ============================================================
    //  STARFIELD
    // ============================================================
    const STAR_COUNT = 120;
    const stars = [];
    for (let i = 0; i < STAR_COUNT; i++) {
      stars.push({
        x: Math.random(),
        y: Math.random(),
        r: 0.3 + Math.random() * 1.1,
        a: 0.04 + Math.random() * 0.14,
        phase: Math.random() * Math.PI * 2,
        speed: 0.08 + Math.random() * 0.4
      });
    }

    // ============================================================
    //  MATH UTILITIES
    // ============================================================
    const SUP = {'0':'\u2070','1':'\u00B9','2':'\u00B2','3':'\u00B3','4':'\u2074','5':'\u2075','6':'\u2076','7':'\u2077','8':'\u2078','9':'\u2079','-':'\u207B'};
    const toSup = n => String(n).split('').map(c => SUP[c] || c).join('');

    function fmt(val, isY) {
      const av = Math.abs(val);
      let s;
      if (av >= 1000 || (isY && av >= 10) || (!isY && av < 0.01)) {
        const e = Math.floor(Math.log10(av));
        const m = av / Math.pow(10, e);
        const ms = Math.abs(m - 1) < 0.001 ? '1' : m.toFixed(2).replace(/\.0$/, '').replace(/\.00$/, '');
        s = ms + '\u00D710' + toSup(e);
      } else if (av >= 100) {
        s = av.toFixed(1).replace(/\.0$/, '');
      } else if (av >= 10) {
        s = av.toFixed(2).replace(/\.0$/, '').replace(/\.00$/, '');
      } else if (av >= 1) {
        s = av.toFixed(3).replace(/\.0$/, '').replace(/\.00$/, '');
      } else {
        s = av.toFixed(4).replace(/\.0$/, '').replace(/\.00$/, '');
      }
      return (isY ? '-' : '') + s;
    }

    // Particle position: x(t) — comes in fast, keeps approaching 0, never touches
    function getX(t) {
      // Power-law decay: steep drop at the start, still visibly creeping toward 0 at t=56
      // t=0: 10, t=1: ~5.6, t=5: ~2.2, t=20: ~0.66, t=56: ~0.32
      return 10 / Math.pow(1 + t, 0.85);
    }

    // View parameters — camera stays centred on the particle the whole time
    function getView(t, x, y) {
      const Wv = Math.max(2.5, 18 * Math.exp(-t / 28));
      const Hv = Wv / aspect;
      const left = x - Wv / 2;
      const top = y + Hv / 2;
      const bottom = top - Hv;
      return { left, right: left + Wv, bottom, top, Wv, Hv };
    }

    // World to screen transform
    function setWorldTransform(v) {
      const sx = W / v.Wv;
      const sy = H / v.Hv;
      ctx.setTransform(sx, 0, 0, -sy, -v.left * sx, H + v.bottom * sy);
    }

    // ============================================================
    //  TRAIL (ring buffer, ~4 seconds = 240 frames)
    // ============================================================
    const TRAIL_LEN = 240;
    const trailX = new Float64Array(TRAIL_LEN);
    const trailY = new Float64Array(TRAIL_LEN);
    let trailHead = 0;
    let trailCount = 0;

    function addTrailPoint(x, y) {
      trailX[trailHead] = x;
      trailY[trailHead] = y;
      trailHead = (trailHead + 1) % TRAIL_LEN;
      if (trailCount < TRAIL_LEN) trailCount++;
    }

    // ============================================================
    //  LYRICS DATA (audio + lyrics start at animation t = 5)
    // ============================================================
    const lyricsData = [
      { start: 0.0,  end: 6.5,  lines: ["Tere rukh se apna raasta"] },
      { start: 6.5,  end: 12.6, lines: ["Mod ke chalaa"] },
      { start: 12.6, end: 23.8, lines: ["Chandan hoon main", "Apni khushboo chhod ke chala"] },
      { start: 23.8, end: 34.5, lines: ["Mann ki maaya rakh ke", "Tere takiye tale"] },
      { start: 34.5, end: 43.9, lines: ["Bairagi, bairagi ka sooti chaula", "Odh ke chalaa"] },
      { start: 43.9, end: 56.0, lines: ["Channa mereya mereya", "Channa mereya mereya"] }
    ];
    let currentLyricIdx = -1;

    function updateLyrics(t) {
      let idx = -1;
      for (let i = 0; i < lyricsData.length; i++) {
        if (t >= lyricsData[i].start && t < lyricsData[i].end) { idx = i; break; }
      }
      if (idx !== currentLyricIdx) {
        currentLyricIdx = idx;
        if (idx === -1) {
          lyricsEl.classList.remove('visible');
        } else {
          lyricsEl.innerHTML = lyricsData[idx].lines.map(l => '<div>' + l + '</div>').join('');
          lyricsEl.classList.add('visible');
        }
      }
    }

    // ============================================================
    //  RENDERING
    // ============================================================
    function drawStars(time) {
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      for (const s of stars) {
        const tw = 0.6 + 0.4 * Math.sin(time * s.speed + s.phase);
        ctx.fillStyle = `rgba(255,255,255,${s.a * tw})`;
        ctx.beginPath();
        ctx.arc(s.x * W, s.y * H, s.r, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function drawAxes(v) {
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      const sx = W / v.Wv;
      const sy = H / v.Hv;
      const ox = -v.left * sx;
      const oy = H + v.bottom * sy;

      ctx.shadowColor = 'rgba(123, 140, 255, 0.35)';
      ctx.shadowBlur = 16;
      ctx.lineWidth = 1.2;
      ctx.strokeStyle = '#7B8CFF';

      ctx.beginPath();
      ctx.moveTo(ox, 0);
      ctx.lineTo(ox, H);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(0, oy);
      ctx.lineTo(W, oy);
      ctx.stroke();

      ctx.shadowBlur = 0;
    }

    function drawCurve(v, particleX) {
      // Only draw the curve up to where the particle currently is — nothing pre-traced ahead.
      let xMin = Math.max(1e-6, -1 / v.bottom);
      let xMax = Math.min(v.right, particleX);

      if (xMin >= xMax) return;

      setWorldTransform(v);

      const samples = 500;
      ctx.beginPath();
      for (let i = 0; i <= samples; i++) {
        const t = i / samples;
        const x = xMin + t * (xMax - xMin);
        const y = -1 / x;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }

      const grad = ctx.createLinearGradient(0, v.top, 0, v.bottom);
      grad.addColorStop(0, '#B8F4FF');
      grad.addColorStop(1, '#73D8FF');

      const ps = W / v.Wv;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      // Soft permanent curve at low opacity
      ctx.shadowColor = 'rgba(184, 244, 255, 0.25)';
      ctx.shadowBlur = 20;
      ctx.strokeStyle = grad;
      ctx.globalAlpha = 0.38;
      ctx.lineWidth = 2.6 / ps;
      ctx.stroke();

      ctx.shadowBlur = 8;
      ctx.lineWidth = 1.4 / ps;
      ctx.stroke();

      ctx.shadowBlur = 0;
      ctx.lineWidth = 0.7 / ps;
      ctx.strokeStyle = 'rgba(255,255,255,0.12)';
      ctx.stroke();

      ctx.globalAlpha = 1.0;
    }

    function drawTrail(v) {
      if (trailCount < 2) return;

      const ps = W / v.Wv;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      for (let i = 0; i < trailCount - 1; i++) {
        const idx = (trailHead - trailCount + i + TRAIL_LEN) % TRAIL_LEN;
        const nxt = (idx + 1) % TRAIL_LEN;

        const age = 1 - i / (trailCount - 1);
        if (age < 0.01) continue;

        const alpha = age * 0.9;
        const width = age * 4.0 / ps + 0.5 / ps;

        // Cyan to indigo mix based on age
        const r = Math.floor(0 + (75 - 0) * (1 - age));
        const g = Math.floor(255 * age + 0 * (1 - age));
        const b = Math.floor(255);
        const color = `rgba(${r}, ${g}, ${b}, ${alpha})`;
        const glow = `rgba(${r}, ${g}, ${b}, ${alpha * 0.5})`;

        ctx.shadowColor = glow;
        ctx.shadowBlur = 18;
        ctx.strokeStyle = color;
        ctx.lineWidth = width;

        ctx.beginPath();
        ctx.moveTo(trailX[idx], trailY[idx]);
        ctx.lineTo(trailX[nxt], trailY[nxt]);
        ctx.stroke();
      }
      ctx.shadowBlur = 0;
    }

    function drawParticle(x, y, v) {
      setWorldTransform(v);

      // Outer cyan-indigo glow
      const rGlow = 22 / (W / v.Wv);
      const g1 = ctx.createRadialGradient(x, y, 0, x, y, rGlow);
      g1.addColorStop(0, 'rgba(0, 255, 255, 0.35)');
      g1.addColorStop(0.4, 'rgba(75, 0, 130, 0.15)');
      g1.addColorStop(1, 'rgba(75, 0, 130, 0)');
      ctx.fillStyle = g1;
      ctx.beginPath();
      ctx.arc(x, y, rGlow, 0, Math.PI * 2);
      ctx.fill();

      // Inner halo
      const rHalo = 10 / (W / v.Wv);
      const g2 = ctx.createRadialGradient(x, y, 0, x, y, rHalo);
      g2.addColorStop(0, 'rgba(184, 244, 255, 0.8)');
      g2.addColorStop(0.35, 'rgba(184, 244, 255, 0.3)');
      g2.addColorStop(1, 'rgba(184, 244, 255, 0)');
      ctx.fillStyle = g2;
      ctx.beginPath();
      ctx.arc(x, y, rHalo, 0, Math.PI * 2);
      ctx.fill();

      // White core with shine
      const rCore = 3.8 / (W / v.Wv);
      ctx.beginPath();
      ctx.arc(x, y, rCore, 0, Math.PI * 2);
      ctx.fillStyle = '#ffffff';
      ctx.shadowColor = 'rgba(255,255,255,0.9)';
      ctx.shadowBlur = 24;
      ctx.fill();

      // Extra bright pinpoint
      const rPin = 1.2 / (W / v.Wv);
      ctx.beginPath();
      ctx.arc(x, y, rPin, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,255,255,1)';
      ctx.shadowColor = 'rgba(255,255,255,1)';
      ctx.shadowBlur = 10;
      ctx.fill();
      ctx.shadowBlur = 0;
    }

    // ============================================================
    //  ANIMATION LOOP
    // ============================================================
    let running = false;
    let t0 = 0;
    let useAudioTime = false;
    let animTime = 0;
    const SONG_LENGTH = 56; // seconds

    audio.addEventListener('play', () => { useAudioTime = true; });

    function frame() {
      let t;
      if (useAudioTime) {
        t = audio.currentTime;
      } else {
        t = (performance.now() - t0) / 1000;
      }
      if (t > SONG_LENGTH) t = SONG_LENGTH;
      animTime = t;

      const x = getX(t);
      const y = -1 / x;
      const v = getView(t, x, y);

      addTrailPoint(x, y);

      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.fillStyle = '#050814';
      ctx.fillRect(0, 0, W, H);

      drawStars(t);
      drawAxes(v);
      drawCurve(v, x);
      drawTrail(v);
      drawParticle(x, y, v);

      xDisplay.textContent = 'x = ' + fmt(x, false);
      yDisplay.textContent = 'y = ' + fmt(y, true);

      updateLyrics(t);

      if (t < SONG_LENGTH) requestAnimationFrame(frame);
    }

    // ============================================================
    //  INPUT HANDLERS
    // ============================================================
    function begin() {
      if (running) return;
      running = true;
      startEl.classList.add('hidden');

      // Show equation screen for 5 seconds, then particle + song start together
      eqScreen.classList.add('visible');
      setTimeout(() => {
        eqScreen.classList.remove('visible');
        valuesEl.classList.add('visible');
        t0 = performance.now();
        audio.play().catch(() => {});
        requestAnimationFrame(frame);
      }, 5000); // tap -> 5s eq screen -> particle descent + song start together
    }

    startEl.addEventListener('click', begin);
    startEl.addEventListener('touchstart', (e) => { e.preventDefault(); begin(); }, { passive: false });
    document.addEventListener('keydown', (e) => {
      if (e.code === 'Space' || e.code === 'Enter') begin();
    });
  </script>
</body>
</html>
