<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>y = -1/x</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Inter:wght@100;200&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      background: #050814;
      overflow: hidden;
      touch-action: none;
      width: 100%;
      height: 100%;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    #ui {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      z-index: 5;
    }
    #values {
      position: absolute;
      top: 5vh;
      left: 7vw;
      color: rgba(255, 255, 255, 0.92);
      font-family: 'Dancing Script', cursive;
      font-size: clamp(22px, 6vw, 34px);
      font-weight: 400;
      line-height: 1.7;
      letter-spacing: 0.02em;
      text-shadow: 0 0 16px rgba(255,255,255,0.25), 0 0 32px rgba(255,255,255,0.1);
      opacity: 0;
      transition: opacity 2.5s ease;
      z-index: 6;
    }
    #values.visible { opacity: 1; }
    #lyrics {
      position: absolute;
      bottom: 12vh;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      font-family: 'Dancing Script', cursive;
      font-size: clamp(28px, 9vw, 48px);
      font-weight: 700;
      color: rgba(255, 255, 255, 0.95);
      text-shadow: 0 0 30px rgba(255,255,255,0.4), 0 0 60px rgba(255,255,255,0.15);
      line-height: 1.45;
      white-space: nowrap;
      opacity: 0;
      transition: opacity 0.9s ease;
      pointer-events: none;
      z-index: 6;
    }
    #lyrics.visible { opacity: 1; }
    #start {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #050814;
      color: rgba(255,255,255,0.5);
      font-family: 'Inter', sans-serif;
      font-size: clamp(11px, 3vw, 14px);
      font-weight: 200;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      cursor: pointer;
      transition: opacity 1.5s ease;
      pointer-events: auto;
      z-index: 10;
    }
    #start.hidden {
      opacity: 0;
      pointer-events: none;
    }
    #start .hint {
      margin-top: 14px;
      font-size: clamp(9px, 2.5vw, 11px);
      letter-spacing: 0.2em;
      color: rgba(255,255,255,0.22);
      text-transform: none;
    }
  </style>
</head>
<body>
  <div id="start">
    <div>Touch to begin</div>
    <div class="hint">Headphones recommended</div>
  </div>
  <canvas id="canvas"></canvas>
  <div id="ui">
    <div id="values">
      <div id="x-display">x = 10</div>
      <div id="y-display">y = -0.1</div>
    </div>
    <div id="lyrics"></div>
  </div>
  <audio id="music" src="music.mp3" preload="auto"></audio>

  <script>
    // ============================================================
    //  CONFIGURATION
    // ============================================================
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    const startEl = document.getElementById('start');
    const valuesEl = document.getElementById('values');
    const xDisplay = document.getElementById('x-display');
    const yDisplay = document.getElementById('y-display');
    const lyricsEl = document.getElementById('lyrics');
    const audio = document.getElementById('music');

    // ============================================================
    //  RESIZE & DPR
    // ============================================================
    let W, H, aspect;
    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      W = Math.floor(window.innerWidth * dpr);
      H = Math.floor(window.innerHeight * dpr);
      canvas.width = W;
      canvas.height = H;
      canvas.style.width = window.innerWidth + 'px';
      canvas.style.height = window.innerHeight + 'px';
      aspect = W / H;
    }
    window.addEventListener('resize', resize);
    resize();

    // ============================================================
    //  STARFIELD
    // ============================================================
    const STAR_COUNT = 100;
    const stars = [];
    for (let i = 0; i < STAR_COUNT; i++) {
      stars.push({
        x: Math.random(),
        y: Math.random(),
        r: 0.3 + Math.random() * 0.9,
        a: 0.05 + Math.random() * 0.12,
        phase: Math.random() * Math.PI * 2,
        speed: 0.12 + Math.random() * 0.35
      });
    }

    // ============================================================
    //  MATH UTILITIES
    // ============================================================
    const SUP = {'0':'\u2070','1':'\u00B9','2':'\u00B2','3':'\u00B3','4':'\u2074','5':'\u2075','6':'\u2076','7':'\u2077','8':'\u2078','9':'\u2079','-':'\u207B'};
    const toSup = n => String(n).split('').map(c => SUP[c] || c).join('');

    function fmt(val, isY) {
      const av = Math.abs(val);
      const sci = isY ? av >= 100 : av < 1;
      let s;
      if (sci) {
        const e = Math.floor(Math.log10(av));
        const m = av / Math.pow(10, e);
        const ms = Math.abs(m - 1) < 0.001 ? '1' : m.toFixed(1).replace(/\.0$/, '');
        s = ms + '\u00D710' + toSup(e);
      } else {
        if (av >= 10) s = av.toFixed(0);
        else if (av >= 1) s = av.toFixed(1).replace(/\.0$/, '');
        else s = av.toFixed(2).replace(/\.0$/, '');
      }
      return (isY ? '-' : '') + s;
    }

    // Particle position: x(t)
    function getX(t) {
      if (t <= 5) return 10 - 1.6 * t;
      return 2 * Math.exp(-0.34 * (t - 5));
    }

    // View parameters
    function getView(t, x, y) {
      let Wv, left;
      if (t < 5) {
        Wv = 40 - 3.2 * t;
        left = -1;
      } else {
        Wv = 12 * x;
        left = -x;
      }
      const Hv = Wv / aspect;
      const top = y + 0.25 * Hv;
      const bottom = top - Hv;
      return { left, right: left + Wv, bottom, top, Wv, Hv };
    }

    // World to screen transform
    function setWorldTransform(v) {
      const sx = W / v.Wv;
      const sy = H / v.Hv;
      ctx.setTransform(sx, 0, 0, -sy, -v.left * sx, H + v.bottom * sy);
    }

    // ============================================================
    //  TRAIL (ring buffer, ~3 seconds = 180 frames)
    // ============================================================
    const TRAIL_LEN = 180;
    const trailX = new Float64Array(TRAIL_LEN);
    const trailY = new Float64Array(TRAIL_LEN);
    let trailHead = 0;
    let trailCount = 0;

    function addTrailPoint(x, y) {
      trailX[trailHead] = x;
      trailY[trailHead] = y;
      trailHead = (trailHead + 1) % TRAIL_LEN;
      if (trailCount < TRAIL_LEN) trailCount++;
    }

    // ============================================================
    //  LYRICS DATA (song starts at animation t = 11)
    // ============================================================
    const lyricsData = [
      { start: 11.0, end: 18.0, lines: ["Tere rukh se apna raasta"] },
      { start: 18.0, end: 24.5, lines: ["Mod ke chalaa"] },
      { start: 24.5, end: 36.5, lines: ["Chandan hoon main", "Apni khushboo chhod ke chala"] },
      { start: 36.5, end: 48.0, lines: ["Mann ki maaya rakh ke", "Tere takiye tale"] },
      { start: 48.0, end: 58.0, lines: ["Bairagi, bairagi ka sooti chaula", "Odh ke chalaa"] },
      { start: 58.0, end: 65.0, lines: ["Channa mereya mereya", "Channa mereya mereya"] }
    ];
    let currentLyricIdx = -1;

    function updateLyrics(t) {
      let idx = -1;
      for (let i = 0; i < lyricsData.length; i++) {
        if (t >= lyricsData[i].start && t < lyricsData[i].end) { idx = i; break; }
      }
      if (idx !== currentLyricIdx) {
        currentLyricIdx = idx;
        if (idx === -1) {
          lyricsEl.classList.remove('visible');
        } else {
          lyricsEl.innerHTML = lyricsData[idx].lines.map(l => '<div>' + l + '</div>').join('');
          lyricsEl.classList.add('visible');
        }
      }
    }

    // ============================================================
    //  RENDERING
    // ============================================================
    function drawStars(time) {
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      for (const s of stars) {
        const tw = 0.6 + 0.4 * Math.sin(time * s.speed + s.phase);
        ctx.fillStyle = `rgba(255,255,255,${s.a * tw})`;
        ctx.beginPath();
        ctx.arc(s.x * W, s.y * H, s.r, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function drawAxes(v) {
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      const sx = W / v.Wv;
      const sy = H / v.Hv;
      const ox = -v.left * sx;
      const oy = H + v.bottom * sy;

      ctx.shadowColor = 'rgba(123, 140, 255, 0.35)';
      ctx.shadowBlur = 16;
      ctx.lineWidth = 1.2;
      ctx.strokeStyle = '#7B8CFF';

      ctx.beginPath();
      ctx.moveTo(ox, 0);
      ctx.lineTo(ox, H);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(0, oy);
      ctx.lineTo(W, oy);
      ctx.stroke();

      ctx.shadowBlur = 0;
    }

    function drawCurve(v) {
      const xAtTop = -1 / v.top;
      const xAtBottom = -1 / v.bottom;

      let xMin = Math.max(1e-12, xAtTop);
      let xMax = xAtBottom;

      if (xMin >= xMax) return;
      if (xMax > v.right) xMax = v.right;

      setWorldTransform(v);

      const samples = 400;
      ctx.beginPath();
      for (let i = 0; i <= samples; i++) {
        const t = i / samples;
        const x = xMin + t * (xMax - xMin);
        const y = -1 / x;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }

      const grad = ctx.createLinearGradient(0, v.top, 0, v.bottom);
      grad.addColorStop(0, '#B8F4FF');
      grad.addColorStop(1, '#73D8FF');

      const ps = W / v.Wv;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      // Soft permanent curve at low opacity
      ctx.shadowColor = 'rgba(184, 244, 255, 0.25)';
      ctx.shadowBlur = 20;
      ctx.strokeStyle = grad;
      ctx.globalAlpha = 0.42;
      ctx.lineWidth = 2.8 / ps;
      ctx.stroke();

      ctx.shadowBlur = 8;
      ctx.lineWidth = 1.6 / ps;
      ctx.stroke();

      ctx.shadowBlur = 0;
      ctx.lineWidth = 0.8 / ps;
      ctx.strokeStyle = 'rgba(255,255,255,0.15)';
      ctx.stroke();

      ctx.globalAlpha = 1.0;
    }

    function drawTrail(v) {
      if (trailCount < 2) return;

      const ps = W / v.Wv;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      for (let i = 0; i < trailCount - 1; i++) {
        const idx = (trailHead - trailCount + i + TRAIL_LEN) % TRAIL_LEN;
        const nxt = (idx + 1) % TRAIL_LEN;

        const age = 1 - i / (trailCount - 1);
        if (age < 0.01) continue;

        const alpha = age * 0.85;
        const width = age * 3.0 / ps + 0.4 / ps;

        ctx.shadowColor = `rgba(124, 92, 255, ${alpha * 0.6})`;
        ctx.shadowBlur = 22;
        ctx.strokeStyle = `rgba(124, 92, 255, ${alpha})`;
        ctx.lineWidth = width;

        ctx.beginPath();
        ctx.moveTo(trailX[idx], trailY[idx]);
        ctx.lineTo(trailX[nxt], trailY[nxt]);
        ctx.stroke();
      }
      ctx.shadowBlur = 0;
    }

    function drawParticle(x, y, v) {
      setWorldTransform(v);

      const rHalo = 14 / (W / v.Wv);
      const g = ctx.createRadialGradient(x, y, 0, x, y, rHalo);
      g.addColorStop(0, 'rgba(184, 244, 255, 0.65)');
      g.addColorStop(0.3, 'rgba(184, 244, 255, 0.2)');
      g.addColorStop(1, 'rgba(184, 244, 255, 0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(x, y, rHalo, 0, Math.PI * 2);
      ctx.fill();

      const rCore = 4.5 / (W / v.Wv);
      ctx.beginPath();
      ctx.arc(x, y, rCore, 0, Math.PI * 2);
      ctx.fillStyle = '#ffffff';
      ctx.shadowColor = 'rgba(255,255,255,0.75)';
      ctx.shadowBlur = 20;
      ctx.fill();
      ctx.shadowBlur = 0;
    }

    // ============================================================
    //  ANIMATION LOOP
    // ============================================================
    let running = false;
    let t0 = 0;
    let audioStarted = false;
    let useAudioTime = false;

    audio.addEventListener('play', () => { useAudioTime = true; });

    function frame() {
      let t;
      if (useAudioTime) {
        t = 5 + audio.currentTime;
      } else {
        t = (performance.now() - t0) / 1000;
        if (t >= 5 && !audioStarted) {
          audio.play().catch(() => {});
          audioStarted = true;
        }
      }
      if (t > 65) t = 65;

      const x = getX(t);
      const y = -1 / x;
      const v = getView(t, x, y);

      addTrailPoint(x, y);

      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.fillStyle = '#050814';
      ctx.fillRect(0, 0, W, H);

      drawStars(t);
      drawAxes(v);
      drawCurve(v);
      drawTrail(v);
      drawParticle(x, y, v);

      xDisplay.textContent = 'x = ' + fmt(x, false);
      yDisplay.textContent = 'y = ' + fmt(y, true);

      updateLyrics(t);

      if (t < 65) requestAnimationFrame(frame);
    }

    // ============================================================
    //  INPUT HANDLERS
    // ============================================================
    function begin() {
      if (running) return;
      running = true;
      startEl.classList.add('hidden');
      valuesEl.classList.add('visible');
      t0 = performance.now();
      requestAnimationFrame(frame);
    }

    startEl.addEventListener('click', begin);
    startEl.addEventListener('touchstart', (e) => { e.preventDefault(); begin(); }, { passive: false });
    document.addEventListener('keydown', (e) => {
      if (e.code === 'Space' || e.code === 'Enter') begin();
    });
  </script>
</body>
</html>
